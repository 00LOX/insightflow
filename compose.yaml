# Local development only: do not expose this stack to the internet.
name: insightflow-local
services:
  db:
    image: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    env_file: ./local/runtime.env
    ports: ['127.0.0.1:54322:5432']
    volumes:
      - insightflow-db:/var/lib/postgresql/data
      - ./local/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports: ['127.0.0.1:54324:8025']
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    env_file: ./local/runtime.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/auth/callback,http://localhost:3000/auth/callback?next=/auth/reset
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: hello@insightflow.local
      GOTRUE_SMTP_SENDER_NAME: InsightFlow
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_PASSWORD_MIN_LENGTH: 8
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db: {condition: service_healthy}
    env_file: ./local/runtime.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
  gateway:
    image: public.ecr.aws/supabase/kong:2.8.1
    depends_on: [auth,rest]
    ports: ['127.0.0.1:54321:8000']
    volumes: ['./local/kong.yml:/kong/kong.yml:ro']
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors
      KONG_NGINX_WORKER_PROCESSES: 1
volumes:
  insightflow-db:
